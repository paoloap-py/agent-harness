[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Five layers of an agent harness, each with the failure it prevents. One file, no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Paolo Perrone" }]
keywords = ["ai-agents", "llm", "agent-harness", "sandboxing", "guardrails"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/paoloap-py/agent-harness"
Article = "https://medium.com/data-science-collective"

[tool.hatch.build.targets.wheel]
only-include = ["harness.py", "py.typed"]
sources = ["."]
