name: harness demos

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No dependencies on purpose: the model is a scripted stand-in, so the
      # demos run anywhere Python does and the claims stay checkable.
      - run: python3 test_harness.py
